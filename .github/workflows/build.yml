name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows (${{ matrix.platform }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [Win32, x64]
        configuration: [Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform == 'x64' && 'x64' || 'x86' }}

      - name: Ensure ATL headers are available
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $installPath = & $vswhere -latest -products * -property installationPath
          if ([string]::IsNullOrWhiteSpace($installPath)) {
            throw "Unable to locate Visual Studio installation via vswhere"
          }

          $atlHeader = Get-ChildItem -Path "$installPath\VC\Tools\MSVC" -Filter atlbase.h -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "atlmfc\\include\\atlbase\.h$" } |
            Select-Object -First 1

          if ($null -ne $atlHeader) {
            Write-Host "ATL header found: $($atlHeader.FullName)"
            exit 0
          }

          Write-Host "ATL header not found; installing Visual Studio ATL/MFC components..."
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          if (-not (Test-Path $installer)) {
            throw "vs_installer.exe not found at $installer"
          }

          & $installer modify `
            --installPath "$installPath" `
            --add Microsoft.VisualStudio.Component.VC.ATL `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --passive --norestart --wait

          if ($LASTEXITCODE -ne 0) {
            throw "vs_installer modify failed with exit code $LASTEXITCODE"
          }

          $atlHeaderAfter = Get-ChildItem -Path "$installPath\VC\Tools\MSVC" -Filter atlbase.h -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "atlmfc\\include\\atlbase\.h$" } |
            Select-Object -First 1
          if ($null -eq $atlHeaderAfter) {
            throw "ATL header still not found after installation"
          }
          Write-Host "ATL header now found: $($atlHeaderAfter.FullName)"

      - name: Ensure 7-Zip is available
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue)) {
            choco install 7zip -y
          }
          7z | Out-Host

      - name: Ensure git tags exist (for git describe)
        shell: pwsh
        run: |
          git fetch --force --tags | Out-Host
          $tagCount = (git tag --list | Measure-Object).Count
          if ($tagCount -eq 0) {
            Write-Host "No tags found; creating local fallback tag v0.0.0"
            git tag v0.0.0
          }
          git describe --tags --long --dirty | Out-Host

      - name: Compute build version (git describe)
        id: version
        shell: pwsh
        run: |
          $version = cmd /c "Source\\Script\\SetGitProperties.cmd" 2>$null
          $version = ($version | Out-String).Trim()
          if ([string]::IsNullOrWhiteSpace($version)) {
            $sha = (git rev-parse --short HEAD).Trim()
            $version = "v0.0.0-0-g$sha"
            Write-Host "Falling back to version: $version"
          }
          "build_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Project64-core runs UpdateVersion.cmd in a pre-build step and expects
      # UpdateVersion.exe to exist under Bin\\<Configuration>(64)\\.
      - name: Build UpdateVersion
        shell: pwsh
        run: |
          msbuild "Source\\UpdateVersion\\UpdateVersion.vcxproj" /m /t:Build `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v142 `
            /p:DefaultPlatformToolset=v142 `
            /verbosity:minimal

      - name: Build solution
        shell: pwsh
        run: |
          msbuild "Project64.sln" /m /t:Build `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /p:PlatformToolset=v142 `
            /p:DefaultPlatformToolset=v142 `
            /verbosity:minimal

      - name: Package zip
        shell: cmd
        run: |
          call Source\Script\package_zip.cmd "%BUILD_VERSION%-${{ matrix.platform }}.zip" "${{ matrix.platform }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Package-${{ matrix.platform }}
          path: Package/*.zip
          if-no-files-found: error